<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home MFE Standalone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-darker: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent-primary: #991b1b;
      --accent-premium: #b45309;
      --border-color: #e2e8f0;
      --border-editorial: #1e293b;
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Inter", system-ui, sans-serif;
      --skeleton-bg: #e2e8f0;
      --skeleton-shimmer: #f1f5f9;
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      padding: 24px;
    }
  </style>
</head>
<body>
  <div style="margin-bottom: 20px; font-size: 0.8rem; font-weight: 700; color: var(--accent-primary); letter-spacing: 0.15em;">HOME MFE STANDALONE DEV MODE</div>
  <div id="app"></div>
  <script type="module">
    import { mount } from './src/mount.js';
    mount(document.getElementById('app'), (path) => alert('Router redirected to: ' + path));
  </script>
</body>
</html>
